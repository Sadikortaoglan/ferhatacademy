# Ferhat Academy — Nginx config
# Dosyayı sunucuda şuraya koy: /etc/nginx/conf.d/ferhatacademy.conf

# ── HTTP → HTTPS redirect (both www and non-www) ───────────────────────────
server {
    listen 80;
    server_name ferhatacademy.com www.ferhatacademy.com;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://ferhatacademy.com$request_uri;
    }
}

# ── www → canonical non-www redirect (HTTPS) ──────────────────────────────
server {
    listen 443 ssl;
    server_name www.ferhatacademy.com;

    ssl_certificate     /etc/letsencrypt/live/ferhatacademy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ferhatacademy.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Permanent redirect to canonical domain — preserves path + query string
    return 301 https://ferhatacademy.com$request_uri;
}

# ── Canonical HTTPS application ────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name ferhatacademy.com;

    ssl_certificate     /etc/letsencrypt/live/ferhatacademy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ferhatacademy.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
