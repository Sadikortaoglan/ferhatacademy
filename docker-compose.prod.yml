services:
  web:
    image: ghcr.io/sadikortaoglan/ferhatacademy:latest
    container_name: ferhatacademy-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3010:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - NODE_ENV=production
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM}
      - ADMIN_NOTIFY_EMAIL=${ADMIN_NOTIFY_EMAIL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ferhatacademy_net
    volumes:
      - ferhatacademy_uploads:/app/public/uploads
    deploy:
      resources:
        limits:
          memory: 768m
          cpus: "0.75"

  postgres:
    image: postgres:16-alpine
    container_name: ferhatacademy-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ferhatacademy_postgres_data:/var/lib/postgresql/data
    networks:
      - ferhatacademy_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.50"

networks:
  ferhatacademy_net:
    name: ferhatacademy_net

volumes:
  ferhatacademy_postgres_data:
    name: ferhatacademy_postgres_data
  ferhatacademy_uploads:
    name: ferhatacademy_uploads
