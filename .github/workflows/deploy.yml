name: Build & Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ferhatacademy

jobs:
  # ── quality gates ──────────────────────────────────────────────────────────
  quality:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://x:x@localhost:5432/x
          BETTER_AUTH_SECRET: dummy-secret-for-build-only
          BETTER_AUTH_URL: https://ferhatacademy.com
          NEXT_PUBLIC_APP_URL: https://ferhatacademy.com

  # ── docker build & push ────────────────────────────────────────────────────
  docker:
    name: Docker → GHCR
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_APP_URL=https://ferhatacademy.com
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── deploy to server ───────────────────────────────────────────────────────
  deploy:
    name: Deploy → Hetzner
    runs-on: ubuntu-latest
    needs: docker
    environment: production

    steps:
      - name: Validate secrets
        run: |
          if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then echo "❌ DEPLOY_HOST secret is missing" && exit 1; fi
          if [ -z "${{ secrets.DEPLOY_USER }}" ]; then echo "❌ DEPLOY_USER secret is missing" && exit 1; fi
          if [ -z "${{ secrets.DEPLOY_SSH_KEY }}" ]; then echo "❌ DEPLOY_SSH_KEY secret is missing" && exit 1; fi
          echo "✅ DEPLOY_HOST: configured"
          echo "✅ DEPLOY_USER: configured"
          echo "✅ DEPLOY_SSH_KEY: configured ($(echo '${{ secrets.DEPLOY_SSH_KEY }}' | wc -c) chars)"

      - name: SSH smoke test
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: whoami && hostname && docker compose version

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/ferhatacademy

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Verify compose config only touches Ferhat Academy
            docker compose -p ferhatacademy -f /opt/ferhatacademy/docker-compose.yml config > /dev/null

            # Check existing production containers are alive
            docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'

            # Pull and start Ferhat Academy only
            docker compose -p ferhatacademy -f /opt/ferhatacademy/docker-compose.yml pull
            docker rm -f ferhatacademy-web 2>/dev/null || true
            docker compose -p ferhatacademy -f /opt/ferhatacademy/docker-compose.yml up -d

            # Wait for health (retry 20x / 3s = 60s)
            echo "Waiting for health check..."
            for i in $(seq 1 20); do
              if curl -sf http://127.0.0.1:3010/api/health; then
                echo "✅ Ferhat Academy is healthy"
                break
              fi
              if [ $i -eq 20 ]; then echo "❌ Health check timed out" && exit 1; fi
              sleep 3
            done

            # Post-deploy safety check
            docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
            free -h
            df -h
