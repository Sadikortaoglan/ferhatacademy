name: Build & Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: sadikortaoglan/ferhatacademy

jobs:
  # ── quality gates ──────────────────────────────────────────────────────────
  quality:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://x:x@localhost:5432/x
          BETTER_AUTH_SECRET: dummy-secret-for-build-only
          BETTER_AUTH_URL: https://ferhatacademy.com
          NEXT_PUBLIC_APP_URL: https://ferhatacademy.com

  # ── docker build & push ────────────────────────────────────────────────────
  docker:
    name: Docker → GHCR
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_APP_URL=https://ferhatacademy.com
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── deploy to server ───────────────────────────────────────────────────────
  deploy:
    name: Deploy → Hetzner
    runs-on: ubuntu-latest
    needs: docker
    environment: production

    steps:
      - name: Validate secrets
        run: |
          if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then echo "❌ DEPLOY_HOST secret is missing" && exit 1; fi
          if [ -z "${{ secrets.DEPLOY_USER }}" ]; then echo "❌ DEPLOY_USER secret is missing" && exit 1; fi
          if [ -z "${{ secrets.DEPLOY_SSH_KEY }}" ]; then echo "❌ DEPLOY_SSH_KEY secret is missing" && exit 1; fi
          echo "✅ DEPLOY_HOST: configured"
          echo "✅ DEPLOY_USER: configured"
          echo "✅ DEPLOY_SSH_KEY: configured ($(echo '${{ secrets.DEPLOY_SSH_KEY }}' | wc -c) chars)"

      - name: SSH smoke test
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: whoami && hostname && docker compose version

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            # Use docker compose v2 (plugin) — docker-compose v1 (Python 1.29.2) has
            # a ContainerConfig bug with newer OCI image formats.
            COMPOSE="docker compose -p ferhatacademy -f /opt/ferhatacademy/docker-compose.yml"

            # ── 1. Verify pre-deploy state ─────────────────────────────────
            echo "=== Pre-deploy containers ==="
            docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'

            # ── 2. Authenticate to GHCR ────────────────────────────────────
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # ── 3. Validate Ferhat Academy compose config ──────────────────
            $COMPOSE config > /dev/null

            # ── 4. Pull Ferhat Academy images only ─────────────────────────
            $COMPOSE pull

            # ── 5. Verify migration targets Ferhat Academy DB ──────────────
            DB_HOST=$(docker inspect ferhatacademy-postgres --format '{{.Name}}' 2>/dev/null || echo "")
            if [ -z "$DB_HOST" ]; then
              echo "❌ ferhatacademy-postgres container not found — aborting migration"
              exit 1
            fi
            echo "✅ Target database: $DB_HOST"

            # ── 6. Run Prisma migration via node:22-alpine ─────────────────
            # Uses node:22-alpine (always has npm) — no dependency on whether the
            # app image includes prisma CLI. Mounts /opt/ferhatacademy/prisma from
            # the server so migration files are always up-to-date from git deploys.
            # prisma migrate deploy is idempotent — exits 0 if nothing is pending.
            echo "Running database migrations..."
            DB_URL=$(grep "^DATABASE_URL" /opt/ferhatacademy/.env | sed 's/^DATABASE_URL=//;s/^"//;s/"$//')
            docker run --rm \
              --network ferhatacademy_net \
              -e DATABASE_URL="$DB_URL" \
              -v /opt/ferhatacademy/prisma:/prisma \
              node:22-alpine \
              sh -c "cd /tmp && npm install prisma@6.19.3 --quiet 2>&1 | tail -1 && ./node_modules/.bin/prisma migrate deploy --schema=/prisma/schema.prisma"
            echo "✅ Migrations done"

            # ── 7. Update only the web service (postgres stays unchanged) ──
            $COMPOSE up -d --no-deps web

            # ── 8. Health check (retry 20x / 3s = 60s) ────────────────────
            echo "Waiting for health check..."
            for i in $(seq 1 20); do
              if curl -sf http://127.0.0.1:3010/api/health; then
                echo ""
                echo "✅ Ferhat Academy is healthy"
                break
              fi
              if [ "$i" -eq 20 ]; then echo "❌ Health check timed out" && exit 1; fi
              sleep 3
            done

            # ── 9. Post-deploy verification ────────────────────────────────
            echo "=== Post-deploy containers ==="
            docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
            free -h
            df -h
